services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: mypetpair
      POSTGRES_USER: mypetpair
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in your shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypetpair"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
