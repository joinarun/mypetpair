spring.application.name=mypetpair
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/mypetpair;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.flyway.enabled=true
app.invitation-required=${APP_INVITATION_REQUIRED:false}
app.invitation-code=${APP_INVITATION_CODE:}
app.admin-owner-ids=${APP_ADMIN_OWNER_IDS:}
app.seed=${APP_SEED:false}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
app.auth-rate-limit=${AUTH_RATE_LIMIT:20}
app.write-rate-limit=${WRITE_RATE_LIMIT:120}
logging.level.org.springframework.web=INFO
